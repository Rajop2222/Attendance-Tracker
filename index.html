#toast.show{opacity:1}#toast.err{background:var(--r);color:var(--on)}#toast.ok{background:var(--g);color:var(--on)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (min-width:860px){nav{position:sticky;top:0;flex:0 0 190px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 10px}.brand{display:block;font-size:1.25rem;padding:0 10px 14px}nav button{flex:none;text-align:left;font-size:.95rem;padding:10px;border-radius:10px}nav button[aria-current]{box-shadow:none;background:var(--bg)}main{padding-bottom:40px}.grid4{grid-template-columns:repeat(4,1fr)}.filt{grid-template-columns:repeat(5,1fr)}#toast{bottom:24px}}

@media print{nav,.btn,#toast,.tabs,.filt{display:none!important}main{padding:0}}
</style>

async function save(){
 if(loadFail){toast("Your saved data couldn’t be loaded, so saving is turned off. Reload the page.","err");return false}
 if(!me.id){toast("You’re logged out. Please log in again.","err");return false}
 try{
  const r=await Promise.race([sb.from("user_state").upsert({user_id:me.id,core:{subjects:S.subjects,target:S.target},recs:{recs:S.recs,last:S.last||null},log:{items:S.log},updated_at:new Date().toISOString()}),new Promise((_,j)=>setTimeout(()=>j(new Error("saving timed out. Check your connection")),15000))]);
  if(r.error)throw new Error(r.error.message);return true}
 catch(e){toast("Couldn’t save: "+e.message,"err");return false}}

 return`<div class="card">`+L.map(e=>`<div class="act"><div>${who} ${e.undo?`undid ${st(e.to)} on <b>${esc(e.sub)}</b>`:e.from?`changed <b>${esc(e.sub)}</b> from ${st(e.from)} to ${st(e.to)}`:`marked <b>${esc(e.sub)}</b> as ${st(e.to)}`}</div><div class="mut sm">${esc(e.code)}, ${esc(e.tn)}, class on ${fmtD(e.date)}</div><div class="mut sm">Updated by ${who} on ${fmtDT(e.at)}</div></div>`).join("")+`</div>`}

 h+=S.subjects.map(s=>{const x=tally(all.filter(r=>r.sid===s.id));return`<div class="row"><span class="dot" style="background:${esc(s.color)}"></span><div class="grow"><b>${esc(s.name)}</b> <span class="mut">${esc(s.code)}</span>${bar(x.pct||0)}</div><div class="num">${pc(x)}<small>${x.p} of ${x.t}</small></div></div>`}).join("")+`</div>`+quick()+`<h2 class="sec">Recent activity</h2>`+actList(5);
 return h}

 <button class="btn big" data-a="saveMark">Save attendance</button><div id="qm">${qmHtml()}</div></div>`}

async function saveMark(){
 const s=S.subjects.find(x=>x.id===M.sid),t=s&&s.teachers.find(x=>x.id===M.tid);
 if(!t)return toast("Choose a subject and a teacher first.","err");
 if(!M.date)return toast("Enter the class date.","err");
 if(!M.status)return toast("Choose Present or Absent before saving.","err");
 
 const now=new Date().toISOString(),id=uid(),to=M.status;
 S.recs[id]={id,sid:s.id,tid:t.id,date:M.date,s:to,c:now,u:now};S.last={t:"add",ids:[id]};
 S.log.unshift({id:uid(),at:now,rid:id,sid:s.id,sub:s.name,code:s.code,tn:t.name,date:M.date,to});S.log=S.log.slice(0,800);
 M.status="";
 if(await save(["recs","log"]))toast(`Saved: ${s.name} marked ${to==="P"?"Present":"Absent"}.`,"ok");
 render()}

async function chg(id){
 const r=S.recs[id];if(!r)return;
 if(pend!==id){pend=id;return render()}
 const from=r.s,to=from==="P"?"A":"P",now=new Date().toISOString(),s=sub(r.sid);
 r.s=to;r.u=now;S.last={t:"chg",id,from};S.log.unshift({id:uid(),at:now,rid:id,sid:r.sid,sub:s.name,code:s.code,tn:tn(r),date:r.date,from,to});S.log=S.log.slice(0,800);pend=null;
 if(await save(["recs","log"]))toast(`Changed to ${to==="P"?"Present":"Absent"}. The old value is kept in your activity log.`,"ok");
 render()}

function filters(){
 const names=[...new Set(S.subjects.filter(s=>!F.sid||s.id===F.sid).flatMap(s=>s.teachers.map(t=>t.name)))];
 return`<div class="card filt"><label>Subject<select data-f="sid"><option value="">All subjects</option>${S.subjects.map(s=>`<option value="${s.id}" ${F.sid===s.id?"selected":""}>${esc(s.name)} (${esc(s.code)})</option>`).join("")}</select></label>
 <label>Teacher<select data-f="tn"><option value="">All teachers</option>${names.map(n=>`<option value="${esc(n)}" ${F.tn===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
 <label>From<input type="date" data-f="from" value="${F.from}"></label><label>To<input type="date" data-f="to" value="${F.to}"></label>
 ${view==="hist"?`<label>Status<select data-f="st"><option value="">Both</option><option value="P" ${F.st==="P"?"selected":""}>+ Present</option><option value="A" ${F.st==="A"?"selected":""}>− Absent</option></select></label>`:""}
 <button class="btn ghost sm" data-a="clr">Clear filters</button></div>`}

function hist(){
 let h=`<h1>History</h1><div class="tabs"><button class="${tab==="rec"?"on":""}" data-a="tab" data-t="rec">Attendance records</button><button class="${tab==="act"?"on":""}" data-a="tab" data-t="act">Recent activity</button></div>`;
 if(tab==="act")return h+actList(100);
 h+=filters();const L=recList();
 if(!L.length)return h+`<div class="card mut">No records match. Mark a class or clear the filters.</div>`;
 return h+`<div class="card">`+L.map(r=>{const s=sub(r.sid),o=r.s==="P"?"+ Present":"− Absent";
 return`<div class="rec"><div class="grow"><b>${esc(s.name)}</b> <span class="mut">${esc(s.code)}</span><div class="mut sm">${esc(tn(r))}, ${fmtD(r.date)}</div><div class="mut sm">Last updated ${fmtDT(r.u)}</div></div>${st(r.s)}</div>`}).join("")+`</div>`}

function trend(L){
 const a=[...L].sort((x,y)=>x.date.localeCompare(y.date)||x.c.localeCompare(y.c));if(a.length<2)return"";let p=0;
 const pts=a.map((r,i)=>{if(r.s==="P")p++;return(i/(a.length-1)*300).toFixed(1)+","+(100-p/(i+1)*100).toFixed(1)}).join(" "),ty=100-S.target;
 return`<div class="card"><h2>Attendance over time</h2><svg class="chart" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Attendance percentage over time"><line x1="0" x2="300" y1="${ty}" y2="${ty}" stroke="var(--mut)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline fill="none" stroke="var(--pri)" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/></svg><div class="mut sm">Running percentage after each class. The dashed line is your ${S.target}% target.</div></div>`}

function stats(){
 let h=`<h1>Statistics</h1>`+filters();const L=recList(),t=tally(L);
 if(!L.length)return h+`<div class="card mut">No attendance in this range yet.</div>`;
 h+=`<div class="card hero"><div class="ring" style="background:conic-gradient(var(--g) 0 ${t.p/t.t*100}%,var(--r) 0)"><b>${pc(t)}</b></div><div class="legend"><h2>Present vs absent</h2><span>${st("P")} ${t.p} classes</span><span>${st("A")} ${t.a} classes</span><span class="${t.pct<S.target?"warn":"mut"} sm">${advice(t)}</span></div></div>`+trend(L);
 return h+S.subjects.map(s=>{const ls=L.filter(r=>r.sid===s.id);if(!ls.length)return"";const x=tally(ls);
 return`<div class="card"><div class="row" style="padding-top:0"><span class="dot" style="background:${esc(s.color)}"></span><div class="grow"><b>${esc(s.name)}</b> <span class="mut">${esc(s.code)}, all teachers</span>${bar(x.pct)}</div><div class="num">${pc(x)}<small>${x.p} of ${x.t}</small></div></div><div class="mut sm">${advice(x)}</div>`+
 s.teachers.map(te=>{const y=tally(ls.filter(r=>r.tid===te.id));return y.t?`<div class="row sub"><div class="grow">${esc(te.name)}${bar(y.pct)}</div><div class="num">${pc(y)}<small>${y.p} of ${y.t}</small></div></div>`:""}).join("")+`</div>`}).join("")}

let editT=null;
function tform(s){
 const e=editT&&editT.sid===s.id?s.teachers.find(z=>z.id===editT.tid):null;
 return`<div class="addt"><input id="nt-${s.id}" placeholder="Short name, for example KD" maxlength="20" aria-label="Teacher short name" value="${esc(e?e.name:"")}"><input id="nf-${s.id}" placeholder="Full name" maxlength="60" aria-label="Teacher full name" value="${esc(e?e.full||"":"")}">${e?`<button class="btn sm" data-a="saveT">Save teacher</button><button class="btn ghost sm" data-a="cancelT">Cancel</button>`:`<button class="btn sm" data-a="addT" data-id="${s.id}">Add teacher</button>`}</div>`}
async function saveT(){
 if(!editT)return;
 const s=sub(editT.sid),t=s.teachers.find(z=>z.id===editT.tid),n=($("#nt-"+s.id).value||"").trim(),f=($("#nf-"+s.id).value||"").trim();
 if(!t)return;
 if(!n)return toast("Enter the teacher’s short name.","err");
 if(s.teachers.some(z=>z.id!==t.id&&z.name.toLowerCase()===n.toLowerCase()))return toast("That short name is already used for this subject.","err");
 t.name=n;t.full=f;editT=null;
 if(await save(["core"]))toast("Teacher updated.","ok");
 render()}
function card(s){return`<div class="card"><div class="row" style="padding-top:0"><span class="dot" style="background:${esc(s.color)}"></span><div class="grow"><b>${esc(s.name)}</b> <span class="mut">${esc(s.code)}</span><div class="mut sm">${[s.sem&&"Semester "+s.sem,s.dept].filter(Boolean).map(esc).join(", ")}</div></div><button class="btn ghost sm" data-a="editSub" data-id="${s.id}">Edit</button><button class="btn ghost sm danger" data-a="delSub" data-id="${s.id}">${pend===s.id?"Confirm delete":"Delete"}</button></div>
 <div>${s.teachers.map(t=>`<span class="chip n"><button class="tl" data-a="editT" data-id="${s.id}" data-t="${t.id}" aria-label="Edit ${esc(t.name)}">${esc(t.name)}${t.full?`, ${esc(t.full)}`:""}</button><button aria-label="Remove ${esc(t.name)}" data-a="delT" data-id="${s.id}" data-t="${t.id}">×</button></span>`).join("")||`<span class="mut sm">No teachers yet.</span>`}</div>
 ${tform(s)}</div>`}
function subList(){const q=(F.q||"").toLowerCase(),L=S.subjects.filter(s=>!q||(s.name+" "+s.code+" "+s.teachers.map(t=>t.name).join(" ")).toLowerCase().includes(q));
 return L.length?L.map(card).join(""):`<div class="card mut">${S.subjects.length?"No subjects match your search.":"No subjects yet. Add your first one above."}</div>`}
function subjects(){
 const e=S.subjects.find(s=>s.id===editing)||{};
 return`<h1>My subjects</h1><div class="card"><h2>${e.id?"Edit subject":"Add a subject"}</h2><div class="two"><label>Subject name<input id="sn" value="${esc(e.name||"")}" maxlength="80"></label><label>Subject code<input id="sc" value="${esc(e.code||"")}" maxlength="20"></label></div>
 ${e.id?"":`<div class="two"><label>Teacher short name (for example KD)<input id="t1" maxlength="20"></label><label>Teacher full name<input id="t1f" maxlength="60"></label></div>`}
 <div class="two"><label>Semester (optional)<input id="sm" value="${esc(e.sem||"")}" maxlength="20"></label><label>Department (optional)<input id="sd" value="${esc(e.dept||"")}" maxlength="40"></label></div>
 <label>Colour<input type="color" id="sk" value="${e.color||PAL[S.subjects.length%PAL.length]}"></label>
 <div class="two"><button class="btn" data-a="saveSub">${e.id?"Save changes":"Add subject"}</button>${e.id?`<button class="btn ghost" data-a="cancelEdit">Cancel</button>`:""}</div></div>
 <input type="search" data-f="q" value="${esc(F.q)}" placeholder="Search by subject, code or teacher" aria-label="Search subjects" style="margin-bottom:12px"><div id="sublist">${subList()}</div>`}
async function saveSub(){
 const v=i=>($("#"+i)?.value||"").trim(),name=v("sn"),code=v("sc");
 if(!name||!code)return toast("Enter the subject name and code.","err");
 if(S.subjects.some(s=>s.id!==editing&&s.code.toLowerCase()===code.toLowerCase()))return toast("That subject code already exists. Add the other teacher to that subject instead.","err");
 const f={name,code,sem:v("sm"),dept:v("sd"),color:$("#sk").value};
 if(editing){Object.assign(S.subjects.find(s=>s.id===editing),f);editing=null}
 else{const t=v("t1");if(!t)return toast("Add at least one teacher.","err");S.subjects.push({id:uid(),...f,teachers:[{id:uid(),name:t,full:v("t1f")}]})}
 if(await save(["core"]))toast("Subject saved.","ok");render()}
async function delSub(id){
 const n=Object.values(S.recs).filter(r=>r.sid===id).length;
 if(n)return toast(`This subject has ${n} attendance record${n==1?"":"s"}, so it can’t be deleted. Your history stays intact.`,"err");
 if(pend!==id){pend=id;return render()}
 S.subjects=S.subjects.filter(s=>s.id!==id);pend=null;if(await save(["core"]))toast("Subject deleted.","ok");render()}
async function addT(id){
 const s=sub(id),n=($("#nt-"+id).value||"").trim(),f=($("#nf-"+id).value||"").trim();
 if(!n)return toast("Enter the teacher’s short name.","err");
 if(s.teachers.some(t=>t.name.toLowerCase()===n.toLowerCase()))return toast("That teacher is already listed for this subject.","err");
 s.teachers.push({id:uid(),name:n,full:f});if(await save(["core"]))toast(`${n} added to ${s.name}.`,"ok");render()}
async function delT(id,tid){
 const n=Object.values(S.recs).filter(r=>r.sid===id&&r.tid===tid).length;
 if(n)return toast(`This teacher has ${n} attendance record${n==1?"":"s"}, so they can’t be removed.`,"err");
 const s=sub(id);s.teachers=s.teachers.filter(t=>t.id!==tid);if(await save(["core"]))toast("Teacher removed.","ok");render()}

function summaryRows(){
 const all=Object.values(S.recs),R=[];
 S.subjects.forEach(s=>{const ls=all.filter(r=>r.sid===s.id);
  s.teachers.forEach(te=>R.push({s:s.name,c:s.code,ts:te.name,tf:te.full||"",...tally(ls.filter(r=>r.tid===te.id))}));
  if(s.teachers.length>1)R.push({s:s.name,c:s.code,ts:"All teachers",tf:"",all:1,...tally(ls)})});
 R.push({s:"Overall",c:"",ts:"All subjects",tf:"",all:1,...tally(all)});
 return R}
function sumTable(){
 const col=r=>r.pct==null?"inherit":r.pct>=S.target?"var(--g)":"var(--r)";
 return`<div class="scroll"><table class="tbl"><thead><tr><th>Subject</th><th>Teacher</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Total</th><th class="n">%</th></tr></thead><tbody>${summaryRows().map(r=>`<tr${r.all?' style="font-weight:700"':""}><td>${esc(r.s)}${r.c?` <span class="mut">${esc(r.c)}</span>`:""}</td><td>${esc(r.ts)}${r.tf?`, ${esc(r.tf)}`:""}</td><td class="n">${r.p}</td><td class="n">${r.a}</td><td class="n">${r.t}</td><td class="n" style="color:${col(r)}">${pc(r)}</td></tr>`).join("")}</tbody></table></div>`}
async function exportSummary(){
 const cell=c=>{c=String(c??"");if(/^[=+\-@]/.test(c))c="'"+c;return'"'+c.replace(/"/g,'""')+'"'};
 const rows=[["Student","Subject","Subject code","Teacher short name","Teacher full name","Present","Absent","Total","Percentage"]];
 summaryRows().forEach(r=>rows.push([me.name,r.s,r.c,r.ts,r.tf,r.p,r.a,r.t,r.pct==null?"":(Math.round(r.pct*10)/10)+"%"]));
 const d=await claude.use("downloads");if(!d)return toast("Downloads aren’t available in this view.","err");
 try{await d.save({filename:"attendance-summary.csv",data:rows.map(r=>r.map(cell).join(",")).join("\n")})}catch(e){toast("The download was cancelled or failed.","err")}}
function settings(){
 const cur=document.documentElement.dataset.theme||"auto",tb=(t,l)=>`<button class="${cur===t?"on":""}" data-a="theme" data-t="${t}">${l}</button>`;
 return`<h1>Settings and profile</h1><div class="card"><h2>Profile</h2><p>${esc(me.name||"")}</p><p class="mut sm">${esc(me.email||"")}</p><button class="btn ghost" data-a="logout">Log out</button></div>
 <div class="card"><h2>Change password</h2><label>New password (at least 6 characters)<input id="np" type="password" autocomplete="new-password"></label><button class="btn" data-a="chpw">Update password</button><div id="qm">${qmHtml()}</div></div>
 <div class="card"><h2>Attendance target</h2><label>Target percentage (warnings appear below this)<input type="number" min="1" max="100" data-f="target" value="${S.target}"></label></div>
 <div class="card"><h2>Appearance</h2><div class="tabs">${tb("auto","Automatic")}${tb("light","Light")}${tb("dark","Dark")}</div></div>
 <div class="card"><h2>Attendance summary</h2>${sumTable()}<div class="two" style="margin-top:12px"><button class="btn" data-a="csvsum">Export summary (CSV)</button><button class="btn ghost" data-a="print">Print summary</button></div></div>
 <div class="card"><h2>Backup</h2><button class="btn ghost" data-a="csv">Export every record (CSV)</button><p class="mut sm" style="margin-top:10px">Export a CSV now and then to keep a backup copy of every record.</p></div>`}
async function exportCsv(){
 const cell=c=>{c=String(c??"");if(/^[=+\-@]/.test(c))c="'"+c;return'"'+c.replace(/"/g,'""')+'"'};
 const rows=[["Student","Subject","Subject code","Teacher","Class date","Status","Created (IST)","Last updated (IST)"]];
 Object.values(S.recs).sort((a,b)=>a.date.localeCompare(b.date)||a.c.localeCompare(b.c)).forEach(r=>{const s=sub(r.sid);rows.push([me.name,s.name,s.code,tn(r),r.date,r.s==="P"?"Present":"Absent",fmtDT(r.c),fmtDT(r.u)])});
 const d=await claude.use("downloads");if(!d)return toast("Downloads aren’t available in this view.","err");
 try{await d.save({filename:"attendance-report.csv",data:rows.map(r=>r.map(cell).join(",")).join("\n")})}catch(e){toast("The download was cancelled or failed.","err")}}

function render(){
 $("#nav").style.display=me.id?"":"none";
 if(ready&&!me.id){$("#main").innerHTML=authView();return}
 $("#nav").innerHTML=`<b class="brand">Attendance</b>`+NAV.map(([v,l])=>`<button data-a="nav" data-v="${v}" ${view===v?'aria-current="page"':""}>${l}</button>`).join("");
 const banner=ready&&loadFail?`<div class="card warn">${loadFail?"Your saved data couldn’t be loaded, so changes are turned off. Reload the page.":"Storage isn’t available, so changes won’t be kept. Sign in to claude.ai and reopen this page."}</div>`:"";
 $("#main").innerHTML=banner+({home,mark,subjects,hist,stats,set:settings})[view]()}

async function act(a,d){
 switch(a){
 case"am":AM=d.m;QM=null;render();break;
 case"login":{const{error}=await sb.auth.signInWithPassword({email:val("ae"),password:$("#ap").value});if(error)return toast(error.message,"err");await boot();break}
 case"signup":{const nm=val("an"),em=val("ae"),pw=$("#ap").value;if(!nm||!em||pw.length<6)return toast("Enter your name, your email and a password of at least 6 characters.","err");const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});if(error)return toast(error.message,"err");if(data.session)await boot();else toast("Account created, but this project still asks for email confirmation. Turn off “Confirm email” in Supabase (see README), then log in.","err");break}
 case"chpw":{const pw=($("#np")||{}).value||"";if(pw.length<6)return toast("Use at least 6 characters.","err");const{error}=await sb.auth.updateUser({password:pw});toast(error?error.message:"Password updated.",error?"err":"ok");break}
 case"logout":await sb.auth.signOut();location.reload();break;
 case"nav":view=d.v;pend=null;editing=null;editT=null;QM=null;render();scrollTo(0,0);break;
 case"pick":M.status=d.s;render();break;
 case"qpick":{QM=null;const v=Q.sel[d.k]||(Q.sel[d.k]={P:0,A:0});v[d.s==="P"?"A":"P"]=0;if(v[d.s]<10)v[d.s]++;else toast("You can add up to 10 at a time.","err");render();break}
 case"qclr":delete Q.sel[d.k];render();break;
 case"undo":await undo();break;
 case"qsave":await qsave();break;
 case"saveMark":await saveMark();break;
 case"tab":tab=d.t;pend=null;render();break;
 case"clr":F={sid:"",tn:"",from:"",to:"",st:"",q:""};render();break;
 case"chg":await chg(d.id);break;
 case"saveSub":await saveSub();break;
 case"editSub":editing=d.id;render();scrollTo(0,0);break;
 case"cancelEdit":editing=null;render();break;
 case"delSub":await delSub(d.id);break;
 case"addT":await addT(d.id);break;
 case"delT":await delT(d.id,d.t);break;
 case"editT":editT={sid:d.id,tid:d.t};render();break;
 case"cancelT":editT=null;render();break;
 case"saveT":await saveT();break;
 case"theme":theme(d.t);render();break;
 case"csv":await exportCsv();break;
 case"csvsum":await exportSummary();break;
 case"print":try{print()}catch(e){toast("Printing isn’t available here.","err")}break}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset).catch(e=>toast("Something went wrong: "+(e&&e.message||e),"err"))});
document.addEventListener("change",async e=>{
 const t=e.target,d=t.dataset;
 if(d.m){M[d.m]=t.value;if(d.m==="sid"){M.tid="";render()}}
 else if(d.q==="date"){Q.date=t.value||today();Q.sel={};render()}
 else if(d.qt){QT[d.qt]=t.value;render()}
 else if(d.f==="target"){const n=Math.min(100,Math.max(1,Math.round(+t.value)||75));S.target=n;if(await save(["core"]))toast(`Target set to ${n}%.`,"ok");render()}
 else if(d.f&&d.f!=="q"){F[d.f]=t.value;if(d.f==="sid")F.tn="";render()}});
document.addEventListener("input",e=>{if(e.target.dataset.f==="q"){F.q=e.target.value;$("#sublist").innerHTML=subList()}});

let AM="in";
const val=i=>(($("#"+i)||{}).value||"").trim();
function authView(){
 const up=AM==="up";
 return`<div class="card" style="max-width:420px;margin:8vh auto 0"><h1>Attendance Tracker</h1><p class="mut">${up?"Create your account":"Log in to your account"}</p>${up?`<label>Full name<input id="an" autocomplete="name" maxlength="60"></label>`:""}<label>Email<input id="ae" type="email" autocomplete="email"></label><label>Password<input id="ap" type="password" autocomplete="${up?"new-password":"current-password"}"></label><button class="btn big" data-a="${up?"signup":"login"}">${up?"Create account":"Log in"}</button><div id="qm">${qmHtml()}</div><p style="margin:14px 0 0"><button class="btn ghost sm" data-a="am" data-m="${up?"in":"up"}">${up?"I already have an account":"Create an account"}</button></p></div>`}
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 S={subjects:[],target:75,recs:{},log:[],last:null};loadFail=false;
 if(!session){me={id:null,name:"",email:""};ready=true;return render()}
 const u=session.user;me={id:u.id,email:u.email||"",name:(u.user_metadata&&u.user_metadata.full_name)||u.email||""};
 const{data,error}=await sb.from("user_state").select("core,recs,log").eq("user_id",u.id).maybeSingle();
 if(error){loadFail=true;console.error(error)}
 else if(data){const c=data.core||{},r=data.recs||{},l=data.log||{};S.subjects=c.subjects||[];S.target=c.target??75;S.recs=r.recs||{};S.last=r.last||null;S.log=l.items||[]}
 ready=true;render()}
(async function init(){
 if(!sb){ready=true;$("#main").innerHTML=`<div class="card"><h2>Almost there</h2><p>Open index.html, paste your Supabase project URL and key near the top of the script, and save. The README has the steps.</p></div>`;return}
 await boot()})();
</script>
</body>
</html>
